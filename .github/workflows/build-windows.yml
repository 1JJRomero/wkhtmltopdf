name: Build Windows (msvc2015-win64)
on:
  push:
    branches: [ windows-build ]
  workflow_dispatch:

jobs:
  msvc2015-win64:
    name: wkhtmltopdf with patched Qt on Windows
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      B: D:\b
    steps:
      - name: install VC++ 2015 build tools
        run: |
          choco install -y --no-progress vcbuildtools -ia "/Full"
          $vc = 'C:\Program Files (x86)\Microsoft Visual Studio 14.0\VC\vcvarsall.bat'
          if (-not (Test-Path $vc)) {
            Write-Host 'vcbuildtools did not provide VC 14.0, adding the v140 toolset to VS 2022'
            & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe' modify `
              --installPath 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise' `
              --add Microsoft.VisualStudio.Component.VC.140 --quiet --norestart --nocache | Out-Default
          }
          if (-not (Test-Path $vc)) { throw "vcvarsall.bat for VC 14.0 not found" }
          "VS140COMNTOOLS=C:\Program Files (x86)\Microsoft Visual Studio 14.0\Common7\Tools\" | Out-File $env:GITHUB_ENV -Append
          cmd /c attrib "C:\Program Files (x86)\Windows Kits\10\include\wdf" +H 2>$null
          exit 0

      - name: install NSIS, jom and Python tools
        run: |
          choco install -y --no-progress nsis jom
          "C:\Program Files\Git\usr\bin" | Out-File $env:GITHUB_PATH -Append
          "C:\ProgramData\chocolatey\bin" | Out-File $env:GITHUB_PATH -Append

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: install pyyaml and conan 1.x
        run: python -m pip install pyyaml "conan<2"

      - name: fetch sources
        run: |
          New-Item -ItemType Directory -Force $env:B | Out-Null
          cd $env:B
          git clone https://github.com/${{ github.repository }}.git src
          cd src
          git checkout ${{ github.sha }}
          git fetch --tags https://github.com/wkhtmltopdf/wkhtmltopdf.git
          git config submodule.qt.url https://github.com/wkhtmltopdf/qt.git
          git submodule update --init
          cd $env:B
          git clone https://github.com/wkhtmltopdf/packaging.git pkg
          # build Qt and wkhtmltopdf with jom (parallel nmake)
          (Get-Content pkg\build.yml) -replace 'make:\s+nmake', 'make:           jom' | Set-Content pkg\build.yml
          # VC 14.0 cannot compile against the newest Windows SDK headers
          # (_mm_loadu_si64 in ucrt\wchar.h), so pin vcvarsall to the oldest
          # complete (ucrt + um + shared) Windows 10 SDK installed.
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' | Select-Object -ExpandProperty Name
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory |
            Where-Object { $_.Name -like '10.0.*' -and (Test-Path (Join-Path $_.FullName 'ucrt\stdio.h')) -and (Test-Path (Join-Path $_.FullName 'um\windows.h')) -and (Test-Path (Join-Path $_.FullName 'shared\sdkddkver.h')) } |
            Sort-Object { [version]$_.Name } | Select-Object -First 1 -ExpandProperty Name
          if (-not $sdk) { throw "no complete Windows 10 SDK found" }
          Write-Host "Using Windows SDK $sdk"
          # VC 14.0 vcvarsall only knows the unversioned SDK bin folder, so
          # put this SDK's tools (mt.exe, rc.exe) on PATH explicitly.
          $sdkbin = "C:\Program Files (x86)\Windows Kits\10\bin\$sdk\x64"
          if (-not (Test-Path "$sdkbin\mt.exe")) { throw "mt.exe not found in $sdkbin" }
          $sdkbin | Out-File $env:GITHUB_PATH -Append
          $py = 'pkg\vagrant\windows.py'
          (Get-Content $py -Raw).Replace('("%s" %s>nul)', '("%s" %s ' + $sdk + '>nul)') | Set-Content $py
          Select-String -Path $py -Pattern 'nul\)'

      - name: build and package
        working-directory: D:\b\pkg
        run: |
          python build vagrant msvc2015-win64 --version - - --iteration 1 ..\src
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          D:\b\build\wkhtmltox\bin\wkhtmltopdf.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: wkhtmltox-msvc2015-win64
          path: |
            D:\b\wkhtmltox-*.exe
            D:\b\build\wkhtmltox\bin\*
          if-no-files-found: error
